[package]
name = "uflowmeter"
categories = ["embedded", "no-std"]
authors = ["Sergej Lepin <sergej.lepin@gmail.com>"]
description = "utrasonic flow meter"
keywords = ["arm", "cortex-m"]
license = "MIT OR Apache-2.0"
version = "0.1.0"
edition = "2021"

[patch.crates-io]
# stm32l1_low_power branch adds STM32L1 to the low_power.rs +
# rtc/low_power.rs cfg gates so embassy's transparent STOP-mode
# executor works on our chip (upstream embassy only supports L4/L5/
# U5/U3/WB/WL/U0). See https://github.com/serdzz/embassy/commit/1cf4496.
embassy-executor = { git = "https://github.com/serdzz/embassy", branch = "stm32l1_low_power" }
embassy-stm32 = { git = "https://github.com/serdzz/embassy", branch = "stm32l1_low_power" }
embassy-time = { git = "https://github.com/serdzz/embassy", branch = "stm32l1_low_power" }
embassy-time-driver = { git = "https://github.com/serdzz/embassy", branch = "stm32l1_low_power" }
embassy-sync = { git = "https://github.com/serdzz/embassy", branch = "stm32l1_low_power" }
embassy-futures = { git = "https://github.com/serdzz/embassy", branch = "stm32l1_low_power" }
embassy-embedded-hal = { git = "https://github.com/serdzz/embassy", branch = "stm32l1_low_power" }

[dependencies]
defmt = "1.0.1"
defmt-rtt = "1.0.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
cortex-m = { version = "0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7.3"

embassy-executor = { version = "0.10.0", features = ["defmt"] }
embassy-stm32 = { version = "0.6.0", features = [
        "defmt",
        "stm32l151rc",
        "time-driver-any",
        "exti",
        "memory-x",
        "unstable-pac",
        "low-power",
        "executor-thread",
] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-sync = { version = "0.8.0", features = ["defmt"] }
embassy-futures = "0.1.2"
embassy-embedded-hal = "0.6.0"

embedded-hal = "1.0"
embedded-hal-async = "1.0"
embedded-storage = "0.3.1"
embedded-storage-async = "0.4"

time = { version = "0.3.22", default-features = false, features = ["macros"] }
microchip-eeprom-25lcxx = { git = "https://github.com/serdzz/microchip-eeprom-25x.git", rev = "b169fe4", features = ["25lc1024"] }
nb = "1.1.0"
bitflags = "2.9.0"
bit_field = "~0.10"
heapless = { version = "0.9", default-features = false }
static_cell = "2.1"
critical-section = "1.1"
lcd = "0.4.1"
paste = "1.0.9"
crc16 = "0.4.0"
modular-bitfield = "0.13.0"
compile-time = "0.2.0"
rand_core = "0.9.3"
rand_pcg = "0.9.0"

[features]
default = []
low_power = []
noswd = []

[lib]
name = "uflowmeter"
path = "src/lib.rs"
test = true

[[bin]]
name = "uflowmeter"
path = "src/main.rs"
test = false
bench = false

[package.metadata.cargo-xbuild]
target = "thumbv7m-none-eabi"

[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 0
overflow-checks = true

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 'z'
overflow-checks = false
