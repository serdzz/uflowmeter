# Application Kconfig fragment — applied on top of the board defconfig.

# --- C++ runtime ---------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y                # zpp requires C++20
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_NEWLIB_LIBC=y              # picolibc is lighter but newlib has
                                  # the strongest C++ stdlib support today
CONFIG_REQUIRES_FULL_LIBCPP=y     # pulls in <cstdio>, <atomic>, <optional>
                                  # via the GLIBCXX_LIBCPP default selector

# --- Peripherals --------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT25=y

# --- System services ----------------------------------------------------
CONFIG_REBOOT=y                   # sys_reboot() used by Bootloader screen
                                  # Enter (via AppRequest::SystemReset)

# --- Diagnostics ---------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n      # save flash; no floating-point logs

# --- Power management ---------------------------------------------------
# Re-enabled in commit-that-unblocks-PM-gap. Zephyr 4.4 has full L1
# PM support upstream (soc/st/stm32/stm32l1x/power.c, by Oleh Kravchenko)
# — no patch needed. Earlier CONFIG_PM=n was a 4.1.99 workaround
# (HAS_PM wasn't declared for L1 there).
#
# Our src/power.cpp pm_state_set / pm_state_exit_post_ops are STRONG
# symbols that override Zephyr's __weak L1 implementations — keeps the
# LCD power-gating (VCC + backlight off pre-STOP, re-init on wake)
# while delegating clock restoration to stm32_clock_control_init via
# the same in-function logic.
CONFIG_PM=y
CONFIG_PM_DEVICE=n                # per-device runtime PM — not used yet
CONFIG_PM_STATS=n                 # instrumentation overhead — off

# Tickless requires TICKLESS_CAPABLE, selected by our board Kconfig
# (boards/uflowmeter/uflowmeter_v1/Kconfig.uflowmeter_v1) because our
# custom RTC sys_clock driver provides the full tickless API.
CONFIG_TICKLESS_KERNEL=y

# --- System clock driver ------------------------------------------------
# Replace the default Cortex-M SysTick driver with our RTC-backed
# implementation in src/timer/uflowmeter_rtc_timer.c. SysTick stops in
# STOP mode; RTC keeps running off LSI through STOP, which is what
# makes k_sleep() survive STOP for us.
CONFIG_CORTEX_M_SYSTICK=n
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=1024
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1024

# We talk to the STM32 RTC + PWR + EXTI registers directly via CMSIS
# headers (stm32l1xx.h) in src/power.cpp + src/timer/. The Zephyr
# stm32 RTC driver would conflict — keep it off.
CONFIG_RTC=n

# --- Clocks --------------------------------------------------------------
# STM32L1 has a documented instability above 16 MHz with shell + SysTick
# (Zephyr issue #22078). The board defconfig already pins SYSCLK at
# 16 MHz from HSE×2 via PLL; don't override here.

# --- Heap / stack -------------------------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
