# Application Kconfig fragment — applied on top of the board defconfig.

# --- C++ runtime ---------------------------------------------------------
CONFIG_CPP=y
CONFIG_STD_CPP20=y                # zpp requires C++20
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_NEWLIB_LIBC=y              # picolibc is lighter but newlib has
                                  # the strongest C++ stdlib support today

# --- Peripherals --------------------------------------------------------
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_EEPROM=y
CONFIG_EEPROM_AT25=y

# --- Diagnostics ---------------------------------------------------------
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n      # save flash; no floating-point logs

# --- Power management ---------------------------------------------------
# STM32L1 has no Zephyr soc/.../power.c — our src/power.cpp provides
# pm_state_set + pm_state_exit_post_ops for STOP mode. The policy
# uses DT power-states / cpu-power-states to decide when to STOP.
CONFIG_PM=y
CONFIG_PM_STATS=n              # disable instrumentation overhead

# Tickless kernel is required for PM (otherwise SysTick keeps the chip
# in run mode at every kernel tick). Our custom RTC timer driver
# supports tickless via sys_clock_set_timeout / sys_clock_announce.
CONFIG_TICKLESS_KERNEL=y

# --- System clock driver ------------------------------------------------
# Replace the default Cortex-M SysTick driver with our RTC-backed
# implementation in src/timer/uflowmeter_rtc_timer.c. SysTick stops in
# STOP mode; RTC keeps running off LSI through STOP, which is what
# makes k_sleep() survive STOP for us.
CONFIG_CORTEX_M_SYSTICK=n
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=1024
CONFIG_SYS_CLOCK_TICKS_PER_SEC=1024

# We talk to the STM32 RTC + PWR + EXTI registers directly via CMSIS
# headers (stm32l1xx.h) in src/power.cpp + src/timer/. The Zephyr
# stm32 RTC driver would conflict — keep it off.
CONFIG_RTC=n

# --- Clocks --------------------------------------------------------------
# STM32L1 has a documented instability above 16 MHz with shell + SysTick
# (Zephyr issue #22078). The board defconfig already pins SYSCLK at
# 16 MHz from HSE×2 via PLL; don't override here.

# --- Heap / stack -------------------------------------------------------
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1024
