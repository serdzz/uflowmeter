name: CI

on:
  push:
    branches: [ main, develop, zephyr ]
  pull_request:
    branches: [ main, develop, zephyr ]

jobs:
  build:
    name: west build (uflowmeter_v1)
    runs-on: ubuntu-latest
    # The Zephyr project publishes a build-toolchain image with the SDK,
    # west, and arm-zephyr-eabi all pre-installed. Pin to a tag matching
    # west.yml's Zephyr revision (v3.7-branch ships toolchain v0.16.x).
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.4
      options: --user root

    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-0.16.8

    steps:
      - name: Check out application
        uses: actions/checkout@v4
        with:
          path: uflowmeter

      - name: Initialize west workspace
        run: |
          west init -l uflowmeter
          west update --narrow -o=--depth=1

      - name: Export Zephyr CMake package
        run: west zephyr-export

      - name: Build for uflowmeter_v1
        working-directory: uflowmeter
        run: |
          west build -b uflowmeter_v1 -p always .

      - name: Report binary size
        working-directory: uflowmeter
        run: |
          $ZEPHYR_SDK_INSTALL_DIR/arm-zephyr-eabi/bin/arm-zephyr-eabi-size \
            build/zephyr/zephyr.elf

      - name: Archive ELF + map
        uses: actions/upload-artifact@v4
        with:
          name: uflowmeter-zephyr-elf
          path: |
            uflowmeter/build/zephyr/zephyr.elf
            uflowmeter/build/zephyr/zephyr.bin
            uflowmeter/build/zephyr/zephyr.map
          if-no-files-found: error
