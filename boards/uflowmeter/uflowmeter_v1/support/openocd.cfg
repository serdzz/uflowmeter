# OpenOCD config for the uflowmeter_v1 board (STM32L151RC + ST-Link).
#
# Adapted from boards/st/nucleo_l152re/support/openocd.cfg — Nucleo
# L152RE uses the dual-bank target (RE = 512 KB Cat.5 device). The
# L151RC is single-bank (Cat.1-3, 256 KB) so we use the plain
# stm32l1.cfg target instead.

source [find interface/stlink.cfg]

transport select hla_swd

source [find target/stm32l1.cfg]

# Connect under reset: prior embassy firmware on this chip puts it
# into STOP mode quickly, which masks SWD probing. Asserting NRST
# during the initial connect halts the chip before its main() runs,
# giving us a clean window for flash erase + program.
reset_config srst_only connect_assert_srst

$_TARGETNAME configure -event gdb-attach {
        echo "Debugger attaching: halting execution"
        reset halt
        gdb_breakpoint_override hard
}

$_TARGETNAME configure -event gdb-detach {
        echo "Debugger detaching: resuming execution"
        resume
}
